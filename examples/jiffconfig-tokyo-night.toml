# Tokyo Night-inspired blues and purples for dark terminals.
# The exact shades come from your terminal's ANSI palette.
[color]
same = { color = "white" }
omitted = { color = "bright_black" }
add = { color = "cyan", bold = true }
add_highlight = { color = "black", bgcolor = "cyan", bold = true }
remove = { color = "magenta", bold = true }
remove_highlight = { color = "black", bgcolor = "magenta", bold = true }

syntax_comment = { color = "bright_black" }
syntax_keyword = { color = "magenta" }
syntax_string = { color = "green" }
syntax_number = { color = "yellow" }
syntax_definition = { color = "blue" }
