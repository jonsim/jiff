# Tokyo Night-inspired blues and purples for dark terminals.
[color]
depth = 256

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false }
omitted = { color = "bright_black", bgcolor = "default", bold = false }
add = { color = "cyan", bgcolor = "default", bold = true }
add_highlight = { color = "black", bgcolor = "cyan", bold = true }
remove = { color = "magenta", bgcolor = "default", bold = true }
remove_highlight = { color = "black", bgcolor = "magenta", bold = true }
overlap_highlight = { color = "white", bgcolor = "blue", bold = true }
syntax_comment = { color = "bright_black", bold = false }
syntax_comment_highlight = { color = "bright_black", bold = false }
syntax_keyword = { color = "magenta", bold = false }
syntax_keyword_highlight = { color = "magenta", bold = false }
syntax_string = { color = "green", bold = false }
syntax_string_highlight = { color = "green", bold = false }
syntax_number = { color = "yellow", bold = false }
syntax_number_highlight = { color = "yellow", bold = false }
syntax_definition = { color = "blue", bold = false }
syntax_definition_highlight = { color = "blue", bold = false }

[color.ansi256]
same = { color = 252, bgcolor = "default", bold = false }
omitted = { color = 103, bgcolor = "default", bold = false }
add = { color = 117, bgcolor = "default", bold = true }
add_highlight = { color = 16, bgcolor = 31, bold = true }
remove = { color = 176, bgcolor = "default", bold = true }
remove_highlight = { color = 16, bgcolor = 97, bold = true }
overlap_highlight = { color = 255, bgcolor = 67, bold = true }
syntax_comment = { color = 103, bold = false }
syntax_comment_highlight = { color = 103, bold = false }
syntax_keyword = { color = 176, bold = false }
syntax_keyword_highlight = { color = 176, bold = false }
syntax_string = { color = 114, bold = false }
syntax_string_highlight = { color = 114, bold = false }
syntax_number = { color = 221, bold = false }
syntax_number_highlight = { color = 221, bold = false }
syntax_definition = { color = 75, bold = false }
syntax_definition_highlight = { color = 75, bold = false }
