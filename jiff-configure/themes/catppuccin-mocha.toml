# Catppuccin Mocha colours from bat's bundled theme.
[color]
depth = 24

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false, italic = false }
line_number = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
line_number_add = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
