# Catppuccin Mocha-inspired pastels for terminals with a dark background.
[color]
depth = 256

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false, italic = false }
line_number = { color = "white", bgcolor = "default", bold = true, italic = false }
omitted = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
add = { color = "green", bgcolor = "default", bold = true, italic = false }
add_highlight = { color = "black", bgcolor = "green", bold = true, italic = false }
remove = { color = "magenta", bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = "black", bgcolor = "magenta", bold = true, italic = false }
overlap_highlight = { color = "black", bgcolor = "yellow", bold = true, italic = false }
syntax_comment = { color = "bright_black", bold = false, italic = false }
syntax_comment_highlight = { color = "bright_black", bold = false, italic = false }
syntax_keyword = { color = "magenta", bold = false, italic = false }
syntax_keyword_highlight = { color = "magenta", bold = false, italic = false }
syntax_string = { color = "green", bold = false, italic = false }
syntax_string_highlight = { color = "green", bold = false, italic = false }
syntax_number = { color = "yellow", bold = false, italic = false }
syntax_number_highlight = { color = "yellow", bold = false, italic = false }
syntax_definition = { color = "cyan", bold = false, italic = false }
syntax_definition_highlight = { color = "cyan", bold = false, italic = false }

[color.ansi256]
same = { color = 189, bgcolor = "default", bold = false, italic = false }
line_number = { color = 189, bgcolor = "default", bold = true, italic = false }
omitted = { color = 103, bgcolor = "default", bold = false, italic = false }
add = { color = 150, bgcolor = "default", bold = true, italic = false }
add_highlight = { color = 16, bgcolor = 150, bold = true, italic = false }
remove = { color = 183, bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = 16, bgcolor = 183, bold = true, italic = false }
overlap_highlight = { color = 16, bgcolor = 222, bold = true, italic = false }
syntax_comment = { color = 103, bold = false, italic = false }
syntax_comment_highlight = { color = 103, bold = false, italic = false }
syntax_keyword = { color = 183, bold = false, italic = false }
syntax_keyword_highlight = { color = 183, bold = false, italic = false }
syntax_string = { color = 150, bold = false, italic = false }
syntax_string_highlight = { color = 150, bold = false, italic = false }
syntax_number = { color = 222, bold = false, italic = false }
syntax_number_highlight = { color = 222, bold = false, italic = false }
syntax_definition = { color = 117, bold = false, italic = false }
syntax_definition_highlight = { color = 117, bold = false, italic = false }
