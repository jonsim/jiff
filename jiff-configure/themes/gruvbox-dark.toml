# Gruvbox-inspired warm colours for terminals with a dark background.
[color]
depth = 256

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false, italic = false }
line_number = { color = "white", bgcolor = "default", bold = true, italic = false }
omitted = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
add = { color = "bright_green", bgcolor = "default", bold = true, italic = false }
add_highlight = { color = "black", bgcolor = "green", bold = true, italic = false }
remove = { color = "bright_red", bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = "black", bgcolor = "red", bold = true, italic = false }
overlap_highlight = { color = "black", bgcolor = "yellow", bold = true, italic = false }
syntax_comment = { color = "bright_black", bold = false, italic = false }
syntax_comment_highlight = { color = "bright_black", bold = false, italic = false }
syntax_keyword = { color = "bright_red", bold = false, italic = false }
syntax_keyword_highlight = { color = "bright_red", bold = false, italic = false }
syntax_string = { color = "bright_green", bold = false, italic = false }
syntax_string_highlight = { color = "bright_green", bold = false, italic = false }
syntax_number = { color = "bright_magenta", bold = false, italic = false }
syntax_number_highlight = { color = "bright_magenta", bold = false, italic = false }
syntax_definition = { color = "bright_yellow", bold = false, italic = false }
syntax_definition_highlight = { color = "bright_yellow", bold = false, italic = false }

[color.ansi256]
same = { color = 223, bgcolor = "default", bold = false, italic = false }
line_number = { color = 223, bgcolor = "default", bold = true, italic = false }
omitted = { color = 245, bgcolor = "default", bold = false, italic = false }
add = { color = 142, bgcolor = "default", bold = true, italic = false }
add_highlight = { color = 16, bgcolor = 70, bold = true, italic = false }
remove = { color = 203, bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = 16, bgcolor = 124, bold = true, italic = false }
overlap_highlight = { color = 16, bgcolor = 214, bold = true, italic = false }
syntax_comment = { color = 245, bold = false, italic = false }
syntax_comment_highlight = { color = 245, bold = false, italic = false }
syntax_keyword = { color = 203, bold = false, italic = false }
syntax_keyword_highlight = { color = 203, bold = false, italic = false }
syntax_string = { color = 142, bold = false, italic = false }
syntax_string_highlight = { color = 142, bold = false, italic = false }
syntax_number = { color = 175, bold = false, italic = false }
syntax_number_highlight = { color = 175, bold = false, italic = false }
syntax_definition = { color = 214, bold = false, italic = false }
syntax_definition_highlight = { color = 214, bold = false, italic = false }
