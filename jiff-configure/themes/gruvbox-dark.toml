# Gruvbox-inspired warm colours for terminals with a dark background.
# The exact shades come from your terminal's ANSI palette.
[color]
same = { color = "white" }
omitted = { color = "bright_black" }
add = { color = "bright_green", bold = true }
add_highlight = { color = "black", bgcolor = "green", bold = true }
remove = { color = "bright_red", bold = true }
remove_highlight = { color = "black", bgcolor = "red", bold = true }
overlap_highlight = { color = "black", bgcolor = "yellow", bold = true }

syntax_comment = { color = "bright_black" }
syntax_keyword = { color = "bright_red" }
syntax_string = { color = "bright_green" }
syntax_number = { color = "bright_magenta" }
syntax_definition = { color = "bright_yellow" }
