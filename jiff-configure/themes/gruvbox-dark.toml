# Gruvbox-inspired warm colours for terminals with a dark background.
[color]
depth = 24

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false, italic = false }
line_number = { color = "white", bgcolor = "default", bold = true, italic = false }
line_number_add = { color = "white", bgcolor = "default", bold = true, italic = false }
line_number_remove = { color = "white", bgcolor = "default", bold = true, italic = false }
omitted = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
add = { color = "bright_green", bgcolor = "default", bold = true, italic = false }
