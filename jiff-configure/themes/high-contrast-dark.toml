# High-contrast colours for terminals with a dark background.
[color]
same = { color = "white" }
omitted = { color = "bright_black" }
add = { color = "cyan", bold = true }
add_highlight = { color = "black", bgcolor = "cyan", bold = true }
remove = { color = "yellow", bold = true }
remove_highlight = { color = "black", bgcolor = "yellow", bold = true }

# Syntax uses foregrounds only, leaving the diff backgrounds in charge.
syntax_comment = { color = "bright_black" }
syntax_keyword = { color = "magenta" }
syntax_string = { color = "cyan" }
syntax_number = { color = "blue" }
syntax_definition = { color = "yellow" }
