# Dracula-inspired greens and purples for terminals with a dark background.
[color]
depth = 256

[color.ansi16]
same = { color = "white", bgcolor = "default", bold = false, italic = false }
line_number = { color = "white", bgcolor = "default", bold = true, italic = false }
line_number_add = { color = "white", bgcolor = "default", bold = true, italic = false }
line_number_remove = { color = "white", bgcolor = "default", bold = true, italic = false }
omitted = { color = "bright_black", bgcolor = "default", bold = false, italic = false }
add = { color = "green", bgcolor = "default", bold = true, italic = false }
add_highlight = { color = "black", bgcolor = "green", bold = true, italic = false }
remove = { color = "red", bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = "black", bgcolor = "red", bold = true, italic = false }
overlap_highlight = { color = "black", bgcolor = "yellow", bold = true, italic = false }
syntax_comment = { color = "bright_black", bold = false, italic = false }
syntax_comment_highlight = { color = "bright_black", bold = false, italic = false }
syntax_keyword = { color = "magenta", bold = false, italic = false }
syntax_keyword_highlight = { color = "magenta", bold = false, italic = false }
syntax_string = { color = "yellow", bold = false, italic = false }
syntax_string_highlight = { color = "yellow", bold = false, italic = false }
syntax_number = { color = "cyan", bold = false, italic = false }
syntax_number_highlight = { color = "cyan", bold = false, italic = false }
syntax_definition = { color = "green", bold = false, italic = false }
syntax_definition_highlight = { color = "green", bold = false, italic = false }

[color.ansi256]
same = { color = 253, bgcolor = "default", bold = false, italic = false }
line_number = { color = 253, bgcolor = "default", bold = true, italic = false }
line_number_add = { color = 253, bgcolor = "default", bold = true, italic = false }
line_number_remove = { color = 253, bgcolor = "default", bold = true, italic = false }
omitted = { color = 103, bgcolor = "default", bold = false, italic = false }
add = { color = 84, bgcolor = "default", bold = true, italic = false }
add_highlight = { color = 16, bgcolor = 84, bold = true, italic = false }
remove = { color = 203, bgcolor = "default", bold = true, italic = false }
remove_highlight = { color = 16, bgcolor = 203, bold = true, italic = false }
overlap_highlight = { color = 16, bgcolor = 228, bold = true, italic = false }
syntax_comment = { color = 103, bold = false, italic = false }
syntax_comment_highlight = { color = 103, bold = false, italic = false }
syntax_keyword = { color = 141, bold = false, italic = false }
syntax_keyword_highlight = { color = 141, bold = false, italic = false }
syntax_string = { color = 228, bold = false, italic = false }
syntax_string_highlight = { color = 228, bold = false, italic = false }
syntax_number = { color = 117, bold = false, italic = false }
syntax_number_highlight = { color = 117, bold = false, italic = false }
syntax_definition = { color = 84, bold = false, italic = false }
syntax_definition_highlight = { color = 84, bold = false, italic = false }
