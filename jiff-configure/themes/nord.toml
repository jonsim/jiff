# Nord-inspired cool colours for terminals with a dark background.
# The exact shades come from your terminal's ANSI palette.
[color]
same = { color = "white" }
omitted = { color = "bright_black" }
add = { color = "cyan", bold = true }
add_highlight = { color = "black", bgcolor = "cyan", bold = true }
remove = { color = "red", bold = true }
remove_highlight = { color = "black", bgcolor = "red", bold = true }
overlap_highlight = { color = "white", bgcolor = "blue", bold = true }

syntax_comment = { color = "bright_black" }
syntax_keyword = { color = "blue" }
syntax_string = { color = "green" }
syntax_number = { color = "magenta" }
syntax_definition = { color = "cyan" }
