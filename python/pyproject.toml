[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiff"
description = "A terminal diff tool with sub-line and side-by-side output"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    "pygments",
    "rich",
    "tomli; python_version < '3.11'",
]

[project.scripts]
jiff = "jiff:main"

[tool.setuptools]
py-modules = ["directory_diff", "jiff", "jiff_config", "jiff_version", "syntax_highlighting"]

[tool.setuptools.dynamic]
version = { attr = "jiff_version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["diff"]
