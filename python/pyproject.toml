[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jiff"
version = "0.1.0"
description = "A terminal diff tool with sub-line and side-by-side output"
requires-python = ">=3.9"
dependencies = [
    "rich",
]

[project.scripts]
jiff = "jiff:main"

[tool.setuptools]
py-modules = ["jiff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["diff"]
